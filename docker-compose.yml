services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-coraza_dashboard}
      POSTGRES_USER: ${DB_USER:-coraza}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coraza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  coraza-spoa:
    image: coraza-spoa:local
    entrypoint: ["/coraza-spoa"]
    command: ["-config", "/etc/coraza-spoa/coraza-spoa.yaml"]
    volumes:
      - coraza_config:/etc/coraza-spoa    # shared config volume
      - coraza_logs:/var/log/coraza    # shared log volume!
    ports:
      - "${CORAZA_SPOE_PORT:-9000}:9000"
    # To enable Prometheus metrics, change command to:
    # command: ["-config", "/etc/coraza-spoa/coraza-spoa.yaml", "-metrics-addr", "0.0.0.0:9090"]

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./services/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./services/haproxy/coraza-spoe.cfg:/usr/local/etc/haproxy/coraza.cfg:ro
    ports:
      - "${HAPROXY_PORT:-80}:80"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    depends_on:
      - coraza-spoa

  httpbin:
    image: mccutchen/go-httpbin:latest
    ports:
      - "8081:8080"

  backend:
    build: ./services/backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-coraza_dashboard}
      DB_USER: ${DB_USER:-coraza}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_FILE: /var/log/coraza/coraza.log
      CORAZA_METRICS_URL: ${CORAZA_METRICS_URL:-}
      CORAZA_CONFIG_PATH: /etc/coraza-spoa/coraza-spoa.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - coraza_logs:/var/log/coraza    # same shared log volume!
      - coraza_config:/etc/coraza-spoa    # backend can write config
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  coraza_logs:
  coraza_config:
