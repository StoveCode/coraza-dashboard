version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coraza_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-coraza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coraza} -d ${POSTGRES_DB:-coraza_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # ──────────────────────────────────────────────
  # Backend (Go API)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-coraza_dashboard}
      DB_USER: ${DB_USER:-coraza}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - external

  # ──────────────────────────────────────────────
  # HAProxy (reverse proxy + WAF entry point)
  # ──────────────────────────────────────────────
  haproxy:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"   # stats page
    volumes:
      - ./services/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend
    networks:
      - internal
      - external

  # ──────────────────────────────────────────────
  # Frontend (Vue 3 Dashboard)
  # ──────────────────────────────────────────────
  frontend:
    build: ./services/frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=${BACKEND_URL:-http://backend:8080}
    depends_on:
      - backend
    networks:
      - internal
      - external

volumes:
  postgres-data:
    driver: local

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
