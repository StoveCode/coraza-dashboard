services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-coraza_dashboard}
      POSTGRES_USER: ${DB_USER:-coraza}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coraza} -d ${DB_NAME:-coraza_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  coraza-spoa:
    image: stove301/coraza-spoa:latest
    entrypoint: ["/coraza-spoa"]
    command: ["-config", "/etc/coraza-spoa/coraza-spoa.yaml"]
    volumes:
      - coraza_config:/etc/coraza-spoa    # shared config volume
    ports:
      - "${CORAZA_SPOE_PORT:-9000}:9000"
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "coraza-spoa"
    depends_on:
      - fluentbit
    # To enable Prometheus metrics, change command to:
    # command: ["-config", "/etc/coraza-spoa/coraza-spoa.yaml", "-metrics-addr", "0.0.0.0:9090"]

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./services/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./services/haproxy/coraza-spoe.cfg:/usr/local/etc/haproxy/coraza.cfg:ro
    ports:
      - "${HAPROXY_PORT:-80}:80"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    depends_on:
      - coraza-spoa

  httpbin:
    image: mccutchen/go-httpbin:latest
    ports:
      - "8081:8080"

  backend:
    build: ./services/backend   # optional: zum lokalen Bauen
    image: stove301/coraza-dashboard-backend:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-coraza_dashboard}
      DB_USER: ${DB_USER:-coraza}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_INGEST_MODE: "true"
      CORAZA_METRICS_URL: ${CORAZA_METRICS_URL:-}
      CORAZA_CONFIG_PATH: /etc/coraza-spoa/coraza-spoa.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - coraza_config:/etc/coraza-spoa    # backend can write config
      - /var/run/docker.sock:/var/run/docker.sock:ro   # for coraza-spoa restart
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  fluentbit:
    image: fluent/fluent-bit:3.2
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - ./services/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./services/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluentbit_db:/var/log
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./services/frontend   # optional: zum lokalen Bauen
    image: stove301/coraza-dashboard-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  coraza_config:
  fluentbit_db:
