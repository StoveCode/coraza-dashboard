#-------------------------------------------------------------------------------
# Coraza WAF Configuration — Demo
#
# This is a minimal Coraza configuration that:
#   1. Enables audit logging in JSON format
#   2. Sends audit logs to the coraza-dashboard backend via HTTP
#   3. Loads the OWASP Core Rule Set (CRS)
#
# Coraza docs: https://coraza.io/docs/
# CRS docs:    https://coreruleset.org/
#-------------------------------------------------------------------------------

# ── Engine Mode ───────────────────────────────────────────────────────────────
# DetectionOnly: log only, never block
# On: enforce blocking rules
SecRuleEngine On

# ── Request / Response Body Handling ─────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

SecResponseBodyAccess On
SecResponseBodyLimit 1048576

# ── Audit Log ─────────────────────────────────────────────────────────────────
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# JSON format — easiest to parse
SecAuditLogFormat JSON
SecAuditLogType Concurrent
SecAuditLog /var/log/coraza/audit.log
SecAuditLogParts ABIJDEFHZ

# ── Send Audit Logs to Dashboard Backend ─────────────────────────────────────
# Uses Coraza's HTTP audit log connector (if available in your build).
# Alternatively, tail /var/log/coraza/audit.log and POST to the backend.
# Example with a log-shipping sidecar (fluentbit, vector, etc.):
#   POST http://backend:8080/api/log
#   Content-Type: application/json
#   Body: <audit log JSON line>

# ── Default Action ────────────────────────────────────────────────────────────
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# ── OWASP Core Rule Set ───────────────────────────────────────────────────────
# Download CRS: https://github.com/coreruleset/coreruleset
# Adjust path as needed
# Include /etc/coraza/crs/crs-setup.conf
# Include /etc/coraza/crs/rules/*.conf

# ── Custom Rules (examples) ───────────────────────────────────────────────────

# Block requests with suspicious User-Agent
SecRule REQUEST_HEADERS:User-Agent "@contains sqlmap" \
    "id:1001,phase:1,deny,status:403,log,msg:'SQLMap scanner detected'"

# Block requests attempting path traversal
SecRule REQUEST_URI "@contains ../" \
    "id:1002,phase:1,deny,status:403,log,msg:'Path traversal attempt'"

# Detect XSS in query string
SecRule ARGS "@detectXSS" \
    "id:1003,phase:2,deny,status:403,log,msg:'XSS attempt in args'"
