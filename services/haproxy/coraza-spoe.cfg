#-------------------------------------------------------------------------------
# Coraza SPOE Configuration for HAProxy
#
# This file configures the HAProxy SPOE (Stream Processing Offload Engine)
# to connect to a running Coraza SPOE agent (coraza-spoe).
#
# Reference: https://github.com/corazawaf/coraza-spoe
# HAProxy SPOE docs: https://www.haproxy.org/download/2.9/doc/SPOE.txt
#-------------------------------------------------------------------------------

[coraza]
spoe-agent coraza-agent
    # Address of the Coraza SPOE process
    address 127.0.0.1:9000
    port    9000

    # Maximum concurrent connections to the agent
    maxconnrate 250
    maxerrrate  100

    # Messages to send to the agent
    messages    coraza-req

    # Options
    option var-prefix    waf
    option set-on-error  local
    log global

spoe-message coraza-req
    # Variables made available to HAProxy from Coraza
    args  unique-id,method=method,path=path,query=query,version=req.ver,\
          headers=req.hdrs,body=req.body

    event on-frontend-http-request
