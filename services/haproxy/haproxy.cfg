#-------------------------------------------------------------------------------
# HAProxy Demo Configuration — Coraza WAF Integration
#
# This configuration shows how to use HAProxy with Coraza WAF via SPOE
# (Stream Processing Offload Engine) to inspect HTTP traffic.
#
# Architecture:
#   Client → HAProxy (port 80) → SPOE (Coraza agent) → Backend
#                                       ↓
#                              Audit logs → coraza-dashboard/backend (port 8080)
#
# NOTE: This is a DEMO config. Adjust bind addresses, backends, and
#       Coraza agent host/port for your environment.
#-------------------------------------------------------------------------------

global
    log         stdout format raw local0 info
    maxconn     50000
    tune.ssl.default-dh-param 2048

    # SPOE engine for Coraza
    # The Coraza SPOE agent runs as a separate process (e.g. coraza-spoe)
    # and listens on localhost:9000
    # Reference: https://github.com/corazawaf/coraza-spoe
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    retries 3

#-------------------------------------------------------------------------------
# Stats Page
#-------------------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:changeme
    stats show-legends
    stats show-node

#-------------------------------------------------------------------------------
# Main Frontend — receives incoming HTTP traffic
#-------------------------------------------------------------------------------
frontend http-in
    bind *:80

    # Attach SPOE filter — sends request to Coraza for inspection
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza-spoe.cfg

    # The SPOE sets variable txn.waf.action = "block" if Coraza blocks the request
    # Block if Coraza says so
    http-request deny deny_status 403 if { var(txn.waf.action) -m str block }

    # Forward legitimate traffic to backend pool
    default_backend app-servers

#-------------------------------------------------------------------------------
# Application Backend Pool
#-------------------------------------------------------------------------------
backend app-servers
    balance roundrobin
    option httpchk GET /api/health

    # In production, replace with real upstream servers
    server app1 127.0.0.1:3000 check

#-------------------------------------------------------------------------------
# Coraza Dashboard Backend (internal)
# Used for direct access to the WAF dashboard API if needed
#-------------------------------------------------------------------------------
backend coraza-dashboard
    server dashboard backend:8080 check
